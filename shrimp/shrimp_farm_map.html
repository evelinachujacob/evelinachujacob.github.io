<style>
:root{
  /* palette: #F7D2B4 peach · #FF6C28 orange · #FFCB30 yellow · #100B7B navy · #7194C9 blue */
  --paper:#FFFFFF; --paper2:#FDF2EA; --ink:#100B7B; --soft:#7C79B6; --bund:#D4D3E7;
  --block:#3B31C9; --scatter:#FF6C28;
  --s1:#9DB4E2; --s2:#7A97D4; --s3:#5875C0; --s4:#3B52AC; --s5:#231C94; --yellow:#FFCB30;
  --disp:'Archivo',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:var(--disp);-webkit-font-smoothing:antialiased}
#map{position:fixed;inset:0;background:var(--paper)}
/* the reference figures sit on a pale grey terrain — greyscale the OSM raster to match */
.leaflet-tile-pane{filter:grayscale(1) contrast(.86) brightness(1.09)}

.hd{position:fixed;top:0;left:0;right:0;padding:16px 22px 26px;z-index:600;pointer-events:none;
  background:linear-gradient(rgba(255,255,255,.94) 55%,rgba(255,255,255,0))}
.hd h1{font-size:17px;font-weight:800;letter-spacing:-.01em;margin:0}
.hd p{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--soft);margin:5px 0 0}
/* the way back to the story - in the title row, so the header keeps its height */
.hd-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.back{pointer-events:auto;display:inline-flex;align-items:center;gap:5px;flex:none;
  padding:5px 12px 5px 8px;border-radius:999px;border:1.5px solid var(--ink,#100B7B);
  background:#fff;color:var(--ink,#100B7B);text-decoration:none;
  font-size:12px;font-weight:600;letter-spacing:.01em;line-height:1.2;
  transition:background-color .2s,color .2s}
.back svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.back:hover{background:var(--ink,#100B7B);color:#fff}
.back:focus-visible{outline:2px solid var(--ink,#100B7B);outline-offset:3px}

.panelbtn{position:fixed;top:14px;right:16px;z-index:700;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:#fff;border:none;padding:9px 13px;cursor:pointer}
.ctl{position:fixed;left:18px;bottom:18px;z-index:650;background:var(--paper2);
  border:1px solid var(--bund);padding:14px 16px;width:268px;max-height:76vh;overflow-y:auto}
.ctl.hide{display:none}
.ctl h2{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--soft);margin:0 0 9px;font-weight:500}
.ctl h2 span{color:var(--scatter);letter-spacing:.08em}
.ctl .grp+h2{margin-top:16px}
label{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:5px;cursor:pointer;line-height:1.3}
input[type=checkbox],input[type=radio]{accent-color:var(--ink);margin:0;flex:none}
.sw{width:11px;height:11px;flex:none;border:1px solid var(--ink)}
.row{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap}
button.mini{font-family:var(--mono);font-size:10px;letter-spacing:.07em;background:transparent;
  border:1px solid var(--bund);color:var(--ink);padding:6px 9px;cursor:pointer}
button.mini:hover,button.mini.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* legend */
.lg{display:flex;margin:2px 0 5px}
.lg div{height:11px;flex:1;border:1px solid var(--ink);border-left:none}
.lg div:first-child{border-left:1px solid var(--ink)}
.lgt{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--soft)}

.dn{font-size:11.5px;line-height:1.5;color:var(--soft);margin:0;
  border-left:2px solid var(--scatter);padding-left:9px}
.dn b{color:var(--ink);font-weight:600}
.bars{margin-top:4px}
.bar{margin-bottom:9px}
.bar .t{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;gap:8px}
.bar .t span{font-family:var(--mono);font-size:10px;color:var(--soft);white-space:nowrap}
.bar .track{height:7px;background:#EFEFF7}
.bar .fill{height:7px;border-radius:0 4px 4px 0;background:var(--s5)}

#info{position:fixed;top:0;right:0;bottom:0;width:330px;background:var(--paper2);
  border-left:1px solid var(--bund);padding:58px 22px 22px;overflow-y:auto;z-index:750;
  transform:translateX(100%);transition:transform .22s ease}
#info.on{transform:none}
#info .kind{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:7px;color:var(--soft)}
#info h3{font-size:20px;font-weight:700;line-height:1.15;margin:0 0 14px;letter-spacing:-.01em}
#info dl{margin:0;font-size:13px}
#info dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin:14px 0 3px}
#info dd{margin:0;line-height:1.45}
#info .note{background:var(--paper);border-left:2px solid var(--scatter);padding:10px 12px;
  font-size:12.5px;line-height:1.45;margin-top:20px}
#close{position:absolute;top:14px;right:18px;font-size:22px;line-height:1;background:none;border:none;cursor:pointer;color:var(--soft)}

.pt{cursor:pointer}
.pt [data-g]{stroke:var(--ink);stroke-opacity:.6;stroke-width:.9;
  vector-effect:non-scaling-stroke;
  filter:drop-shadow(0 0 1.3px rgba(255,255,255,.95)) drop-shadow(0 0 1.3px rgba(255,255,255,.9))}
.pt.sel [data-g]{stroke-opacity:1;stroke-width:2.4}
.pt.flag [data-g]{stroke-opacity:1;stroke-width:1.7;stroke-dasharray:2.5 2}
.glyphkey{display:inline-flex;width:16px;justify-content:center;flex:none}
.route{stroke:var(--s5);stroke-width:1.8;fill:none;stroke-linecap:round}
.route.draw{transition:stroke-dashoffset 1.15s cubic-bezier(.4,0,.2,1)}
.route.flow{stroke-dasharray:7 11;animation:flow 1.5s linear infinite}
@keyframes flow{to{stroke-dashoffset:-36}}
.dest{font-family:var(--disp);font-weight:700;font-size:11.5px;color:var(--ink);
  text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;white-space:nowrap;pointer-events:none}
.dest em{display:block;font-family:var(--mono);font-size:8.5px;font-style:normal;
  color:var(--soft);font-weight:400}
.dlbl{font-family:var(--disp);font-weight:700;font-size:12px;color:var(--ink);
  text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;white-space:nowrap;pointer-events:none}
.dlbl em{display:block;font-family:var(--mono);font-size:8.5px;font-style:normal;color:var(--soft)}

#tablewrap{position:fixed;inset:0;background:rgba(255,255,255,.97);z-index:800;padding:64px 28px 28px;overflow:auto;display:none}
#tablewrap.on{display:block}
table{border-collapse:collapse;font-size:12px;width:100%;max-width:820px}
th,td{text-align:left;padding:6px 12px 6px 0;border-bottom:1px solid var(--bund)}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:500}
td.n{font-family:var(--mono);text-align:right;padding-right:22px}
.chip{display:inline-block;width:9px;height:9px;border:1px solid var(--ink);margin-right:7px;vertical-align:-1px}

.leaflet-control-zoom{margin-top:78px!important;border:1px solid var(--bund)!important}
.leaflet-control-zoom a{color:var(--ink)!important}
.leaflet-container{font-family:var(--mono);font-size:10px;background:var(--paper)}
.leaflet-control-attribution{font-size:9.5px!important;background:rgba(255,255,255,.85)!important}
.leaflet-control-attribution a{color:var(--soft)!important}
.leaflet-control-scale-line{border-color:var(--ink)!important;color:var(--ink)!important;
  background:rgba(255,255,255,.8)!important;font-family:var(--mono)!important}
@media(max-width:760px){#info{width:100%}.ctl{width:200px;padding:11px 12px}}

const vis=s=>onKind[s[3]]&&onDist[s[4]];

const hexLayer=L.layerGroup().addTo(map);
const polyLayer=L.layerGroup();
let CELLS=[];

function build(){
  hexLayer.clearLayers();
  const size=hexKm*1000/Math.cos(LAT0*D2R);      // metres in mercator at this latitude
  const bin={};
  SMP.forEach(s=>{
    if(!vis(s)) return;
    const x=mx(s[1]), y=my(s[0]);
    const q=(2/3*x)/size, r=(-1/3*x+SQ3/3*y)/size;
    const [hq,hr]=hexRound(q,r); const k=hq+":"+hr;
    const c=bin[k]||(bin[k]={q:hq,r:hr,a:0,n:0,kk:[0,0],dd:DISTS.map(()=>0)});
    c.a+=s[2]; c.n++; c.kk[s[3]]+=s[2]; c.dd[s[4]]+=s[2];
  });
  CELLS=Object.values(bin).sort((a,b)=>b.a-a.a);
  const vals=CELLS.map(c=>c.a).sort((a,b)=>a-b);
  const qt=t=>vals.length?vals[Math.floor(t*(vals.length-1))]:0;
  const CUT=[qt(.2),qt(.4),qt(.6),qt(.8)];
  const step=a=>a<=CUT[0]?0:a<=CUT[1]?1:a<=CUT[2]?2:a<=CUT[3]?3:4;

  CELLS.forEach((c,i)=>{
    const cxm=size*1.5*c.q, cym=size*(SQ3/2*c.q+SQ3*c.r);
    const pts=[];
    for(let k=0;k<6;k++){
      const a=Math.PI/180*60*k;
      pts.push([iy(cym+size*Math.sin(a)), ix(cxm+size*Math.cos(a))]);
    }
    c.ll=[iy(cym),ix(cxm)]; c.i=i;
    const ly=L.polygon(pts,{color:"#FFFFFF",weight:.8,opacity:.9,
      fillColor:RAMP[step(c.a)],fillOpacity:.88});
    ly.on("mouseover",()=>ly.setStyle({color:"#100B7B",weight:2}));
    ly.on("mouseout",()=>{if(sel!==i)ly.setStyle({color:"#FFFFFF",weight:.8});});
    ly.on("click",e=>{L.DomEvent.stopPropagation(e);pick(i);});
    ly.bindTooltip(Math.round(c.a).toLocaleString("en-IN")+" ha of "+Math.round(2.598*hexKm*hexKm*100).toLocaleString("en-IN")+" ha hex",{sticky:true});
    c.ly=ly; hexLayer.addLayer(ly);
  });
  legend(CUT);
  bars();
  document.getElementById("sub").textContent=
    CELLS.length+" hexes at "+hexKm+" km · "+POLY.length+" source polygons · "+
    Math.round(CELLS.reduce((s,c)=>s+c.a,0)).toLocaleString("en-IN")+
    " ha of mapped ground · "+PTS.length+" facilities · OpenStreetMap basemap";
}

function legend(CUT){
  document.getElementById("lg").innerHTML=RAMP.map(c=>'<div style="background:'+c+'"></div>').join("");
  const f=v=>v>=1000?Math.round(v/1000)+"k":Math.round(v);
  document.getElementById("lgt").innerHTML="<span>low</span><span>"+f(CUT[1])+
    "</span><span>"+f(CUT[3])+" ha</span>";
}

function pick(i){
  if(sel!==null&&CELLS[sel]) CELLS[sel].ly.setStyle({color:"#FFFFFF",weight:.8});
  sel=i; const c=CELLS[i]; c.ly.setStyle({color:"#100B7B",weight:2.6});
  const tot=CELLS.reduce((s,x)=>s+x.a,0);
  const dom=c.dd.indexOf(Math.max(...c.dd));
  const hk=document.getElementById("i-kind");
  hk.style.color="var(--soft)";
  hk.textContent=hexKm+" km hex · rank "+(i+1)+" of "+CELLS.length;
  document.getElementById("i-name").textContent=DISTS[dom];
  const kk=c.kk.map((v,j)=>v>0?KLBL[j]+" "+Math.round(v/c.a*100)+"%":null).filter(Boolean).join(", ");
  document.getElementById("i-dl").innerHTML=
    "<dt>Extent in this hex</dt><dd>"+Math.round(c.a).toLocaleString("en-IN")+" ha · "+
      (c.a/tot*100).toFixed(1)+"% of all drawn extent</dd>"+
    "<dt>Composition</dt><dd>"+kk+"</dd>"+
    "<dt>Hex centre</dt><dd>"+c.ll[0].toFixed(4)+"°N, "+c.ll[1].toFixed(4)+"°E</dd>"+
    "<dt>Hex area</dt><dd>"+Math.round(2.598*hexKm*hexKm)+" km² · "+
      Math.min(100,c.a/100/(2.598*hexKm*hexKm)*100).toFixed(1)+"% of it inside a farm zone</dd>";
  document.getElementById("i-note").textContent=
    "Measured from hand-drawn zone outlines, not detected ponds. Overlapping polygons are "+
    "dissolved so ground is counted once, but a filled hex still only means the outline "+
    "covered it — not that every hectare in it is pond.";
  document.getElementById("info").classList.add("on");
}
function unpick(){
  if(sel!==null&&CELLS[sel]) CELLS[sel].ly.setStyle({color:"#FFFFFF",weight:.8});
  sel=null;
  if(selPt!==null){ptMarkers.forEach(m=>{const e=m.getElement&&m.getElement();
    if(e&&e.firstChild) e.firstChild.classList.remove("sel");}); selPt=null;}
  document.getElementById("info").classList.remove("on");
}
document.getElementById("close").onclick=unpick;
map.on("click",unpick);

const dot=c=>'<circle data-g cx="9" cy="9" r="5.2" fill="'+c+'"/>';
/* one hue per facility type, shape kept as the second cue */
const PCOL={"Hatchery":"#FF6C28","Export":"#FFCB30","NBC":"#6FD8A8","Port":"#4FB3E0",
            "BMC":"#F7D2B4","AQS":"#8E44C9","Shrimp Farm Cluster":"#2E7D32","feed mill":"#C2185B"};
const CATS=[...new Set(PTS.map(p=>p.c))]
  .map(c=>({c,t:PTS.find(p=>p.c===c).t,s:PTS.find(p=>p.c===c).s,n:PTS.filter(p=>p.c===c).length}))
  .sort((a,b)=>b.n-a.n);
const onCat={}; CATS.forEach(c=>onCat[c.c]=true);
let showPts=true, selPt=null;

const glyphSvg=(col,cls)=>'<svg class="pt '+(cls||"")+
  '" width="18" height="18" viewBox="0 0 18 18">'+dot(col)+'</svg>';
/* 138 dots on the full coast is a smear — they arrive once you are close enough
   for a village-level pin to mean anything */
const PT_MIN_ZOOM=9;

const ptLayer=L.layerGroup().addTo(map);
const ptMarkers=PTS.map((p,i)=>{
  const m=L.marker([p.la,p.lo],{icon:L.divIcon({className:"",
    html:glyphSvg(PCOL[p.c],p.f?"flag":""),iconSize:[18,18],iconAnchor:[9,9]}),
    riseOnHover:true, zIndexOffset:400});
  m.bindTooltip(p.n+" — "+p.t,{direction:"top",offset:[0,-8]});
  m.on("click",e=>{L.DomEvent.stopPropagation(e);pickPt(i);});
  return m;
});
function drawPts(){
  ptLayer.clearLayers();
  const near=map.getZoom()>=PT_MIN_ZOOM;
  const hint=document.getElementById("ptzoom");
  if(hint) hint.textContent = near ? "" : "zoom in to show";
  if(!showPts||!near) return;
  PTS.forEach((p,i)=>{ if(onCat[p.c]) ptLayer.addLayer(ptMarkers[i]); });
}
function pickPt(i){
  unpick(); selPt=i; const p=PTS[i];
  ptMarkers.forEach((m,k)=>{const e=m.getElement&&m.getElement();
    if(e&&e.firstChild) e.firstChild.classList.toggle("sel",k===i);});
  const ik=document.getElementById("i-kind");
  ik.textContent=p.t; ik.style.color=PCOL[p.c];
  document.getElementById("i-name").textContent=p.n;
  let h="";
  if(p.sub)      h+="<dt>Recorded as</dt><dd>"+p.sub+"</dd>";
  if(p.x&&p.x.length) h+="<dt>Details</dt><dd>"+p.x.join("<br>")+"</dd>";
  if(p.v)        h+="<dt>Village / area</dt><dd>"+p.v+"</dd>";
  if(p.d)        h+="<dt>District</dt><dd>"+p.d+"</dd>";
  if(p.cl&&!/^\d+$/.test(p.cl)) h+="<dt>Cluster</dt><dd>"+p.cl+"</dd>";
  h+="<dt>Coordinates</dt><dd>"+p.la.toFixed(4)+"°N, "+p.lo.toFixed(4)+"°E"+
     (p.p?"<br><span style='color:var(--soft)'>recorded precision: "+p.p+"</span>":"")+"</dd>";
  if(p.g) h+="<dt>Source link</dt><dd><a href='"+p.g+"' target='_blank' rel='noopener' "+
             "style='color:var(--scatter)'>Google Maps search</a></dd>";
  document.getElementById("i-dl").innerHTML=h;
  document.getElementById("i-note").textContent = p.f
    ? "⚠ "+p.f+". Left exactly where the shapefile puts it — not silently moved."
    : (/NOT exact|area reference|village reference|area centroid/i.test(p.p||"")
        ? "This pin is a village or area reference, not a surveyed facility location. Treat it as \u2018a facility of this type is somewhere here\u2019."
        : "Position as recorded in the QGIS point layer.");
  document.getElementById("info").classList.add("on");
}

/* ---------- export destinations ----------
   Only what the Andhra assessment actually names. No tonnages or shares are
   invented: the report gives destinations, not a split. */
const DEST=[
  {n:"USA",            la:39.8,  lo:-98.6, s:"Named as a majority destination in the report's supply-chain diagram (p.11). Antimicrobial residues in Indian shrimp have been reported here (p.26)."},
  {n:"China",          la:35.0,  lo:105.0, s:"Named as a majority destination in the report's supply-chain diagram (p.11)."},
  {n:"European Union", la:50.85, lo:4.35,  s:"Consignments have been rejected in the EU over poor hygiene and antibiotic residues (p.26)."},
  {n:"Japan",          la:36.2,  lo:138.3, s:"Antimicrobial residues in Indian shrimp exported here have been reported (p.26)."}
];
const EXP=PTS.filter(p=>p.c==="Export");
const ORIGIN=[EXP.reduce((s,p)=>s+p.la,0)/EXP.length, EXP.reduce((s,p)=>s+p.lo,0)/EXP.length];

const routeLayer=L.layerGroup(), destLayer=L.layerGroup();
let routesOn=false;

function arc(a,b){
  // bow the line away from the straight chord so overlapping routes stay legible
  const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
  const dx=b[1]-a[1], dy=b[0]-a[0], L2=Math.hypot(dx,dy);
  const cx=mx+(dx/L2)*0+ (L2*0.16), cy=my;   // lift the midpoint northwards
  const pts=[];
  for(let t=0;t<=1;t+=1/64){
    const u=1-t;
    pts.push([u*u*a[0]+2*u*t*cx+t*t*b[0], u*u*a[1]+2*u*t*cy+t*t*b[1]]);
  }
  return pts;
}

DEST.forEach((d,i)=>{
  const ly=L.polyline(arc(ORIGIN,[d.la,d.lo]),{className:"route",interactive:false});
  d.ly=ly; routeLayer.addLayer(ly);
  const m=L.circleMarker([d.la,d.lo],{radius:7,color:"#100B7B",weight:1.2,
    fillColor:PCOL.Export,fillOpacity:1});
  m.on("click",e=>{L.DomEvent.stopPropagation(e);pickDest(i);});
  m.bindTooltip(d.n,{direction:"top",offset:[0,-8]});
  destLayer.addLayer(m);
  destLayer.addLayer(L.marker([d.la,d.lo],{interactive:false,icon:L.divIcon({className:"dest",
    html:d.n+"<em>export destination</em>",iconSize:[150,26],iconAnchor:[75,-10]})}));
});

function animateRoutes(){
  DEST.forEach((d,i)=>{
    const p=d.ly.getElement&&d.ly.getElement();
    if(!p||!p.getTotalLength) return;
    const L3=p.getTotalLength();
    p.classList.remove("flow","draw");
    p.style.strokeDasharray=L3+" "+L3;
    p.style.strokeDashoffset=L3;
    void p.getBoundingClientRect();
    setTimeout(()=>{
      p.classList.add("draw");
      p.style.strokeDashoffset=0;
      setTimeout(()=>{p.classList.remove("draw");p.style.strokeDasharray="";
        p.style.strokeDashoffset="";p.classList.add("flow");},1200);
    }, i*160);
  });
}

function toggleRoutes(on){
  routesOn=on;
  if(on){
    routeLayer.addTo(map); destLayer.addTo(map);
    const b=L.latLngBounds([ORIGIN]).extend([DEST[0].la,DEST[0].lo]);
    DEST.forEach(d=>b.extend([d.la,d.lo]));
    const need=!map.getBounds().contains(b);
    if(need) map.flyToBounds(b,{padding:[80,80],duration:1.1});
    setTimeout(animateRoutes, need?900:60);
  }else{
    map.removeLayer(routeLayer); map.removeLayer(destLayer);
  }
}
function pickDest(i){
  unpick(); const d=DEST[i];
  const ik=document.getElementById("i-kind");
  ik.textContent="Export destination"; ik.style.color=PCOL.Export;
  document.getElementById("i-name").textContent=d.n;
  document.getElementById("i-dl").innerHTML=
    "<dt>Shipped from</dt><dd>"+EXP.length+" export houses across coastal Andhra Pradesh</dd>"+
    "<dt>Anchor point</dt><dd>"+d.la.toFixed(2)+"°N, "+Math.abs(d.lo).toFixed(2)+"°"+(d.lo<0?"W":"E")+"</dd>";
  document.getElementById("i-note").textContent=d.s+
    " The route lines show that a destination is named, not how much goes there — the report gives no volume split.";
  document.getElementById("info").classList.add("on");
}

/* ---------- district captions ---------- */
const capt=DISTS.map((d,di)=>{
  const ps=POLY.filter(p=>p.d===di);
  const la=ps.reduce((s,p)=>s+p.c[1],0)/ps.length, ln=ps.reduce((s,p)=>s+p.c[0],0)/ps.length;
  const a=ps.reduce((s,p)=>s+p.a,0);
  return L.marker([la,ln],{interactive:false,icon:L.divIcon({className:"dlbl",
    html:d+"<em>"+ps.length+" polygons · "+Math.round(a).toLocaleString("en-IN")+" ha</em>",
    iconSize:[190,30],iconAnchor:[95,15]})});
});
function captions(){const on=map.getZoom()<=8;capt.forEach(m=>on?m.addTo(map):map.removeLayer(m));}
map.on("zoomend",()=>{captions();drawPts();}); captions();

/* ---------- controls ---------- */
[5,10,20,40].forEach(k=>{
  const b=document.createElement("button");
  b.className="mini"+(k===hexKm?" on":""); b.textContent=k+" km";
  b.onclick=()=>{hexKm=k;unpick();
    document.querySelectorAll("#hexsize button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); build();};
  document.getElementById("hexsize").append(b);
});
function chk(host,items,cb,checked){
  items.forEach(([v,label,c],i)=>{
    const l=document.createElement("label");
    l.innerHTML='<input type="checkbox" '+(checked?"checked":"")+'>'+
      (c?'<span class="sw" style="background:'+c+'"></span>':"")+label;
    l.querySelector("input").onchange=e=>{cb(i,e.target.checked);};
    host.append(l);
  });
}
chk(document.getElementById("kinds"),KLBL.map((l,i)=>[i,l,KCOL[i]]),
  (i,on)=>{onKind[i]=on;unpick();build();},true);
chk(document.getElementById("dists"),DISTS.map(d=>[d,d,null]),
  (i,on)=>{onDist[i]=on;unpick();build();},true);
CATS.forEach(c=>{
  if(c.c==="Export") onCat[c.c]=true;
  const l=document.createElement("label");
  l.innerHTML='<input type="checkbox" checked><span class="glyphkey">'+glyphSvg(PCOL[c.c])+
    '</span>'+c.t+' <span style="color:var(--soft);font-family:var(--mono);font-size:10px">'+c.n+'</span>';
  l.querySelector("input").onchange=e=>{onCat[c.c]=e.target.checked;drawPts();
    if(c.c==="Export") toggleRoutes(e.target.checked);};
  document.getElementById("cats").append(l);
});
chk(document.getElementById("lay"),[[0,"Hex density",null],[1,"Source polygon outlines",null],[2,"Facility points",null]],
  (i,on)=>{
    if(i===0){showHex=on; on?hexLayer.addTo(map):map.removeLayer(hexLayer);}
    else if(i===1){showPoly=on; on?polyLayer.addTo(map):map.removeLayer(polyLayer);}
    else{showPts=on; drawPts();}
  },true);
// the second layer box starts unchecked
setTimeout(()=>{const b=document.querySelectorAll("#lay input")[1]; if(b){b.checked=false;}},0);

function bars(){
  const rows=DISTS.map((d,i)=>{
    const a=CELLS.reduce((s,c)=>s+c.dd[i],0);
    return [d,a];}).filter(r=>r[1]>0).sort((a,b)=>b[1]-a[1]);
  const max=Math.max(1,...rows.map(r=>r[1]));
  document.getElementById("bars").innerHTML=rows.map(([d,a])=>
    '<div class="bar"><div class="t"><b>'+d+'</b><span>'+Math.round(a).toLocaleString("en-IN")+' ha</span></div>'+
    '<div class="track"><div class="fill" style="width:'+Math.max(2,a/max*100)+'%"></div></div></div>'
  ).join("")||'<p style="font-size:12px;color:var(--soft);margin:0">nothing selected</p>';
}

document.getElementById("tt").innerHTML=
  "<tr><th>District</th><th>Type</th><th class='n'>Extent (ha)</th><th class='n'>Vertices</th><th>Centroid</th><th>Layer</th></tr>"+
  POLY.map(p=>"<tr><td>"+DISTS[p.d]+"</td><td><span class='chip' style='background:"+KCOL[p.k]+"'></span>"+
    KINDS[p.k]+"</td><td class='n'>"+p.a.toLocaleString("en-IN")+"</td><td class='n'>"+p.r.length+"</td>"+
    "<td>"+p.c[1].toFixed(3)+"°N "+p.c[0].toFixed(3)+"°E</td><td><code>"+p.l.trim()+"</code></td></tr>").join("");
document.getElementById("tbl").onclick=()=>document.getElementById("tablewrap").classList.add("on");
document.getElementById("tclose").onclick=()=>document.getElementById("tablewrap").classList.remove("on");
document.getElementById("toggle").onclick=()=>document.getElementById("ctl").classList.toggle("hide");
document.getElementById("fit").onclick=()=>map.fitBounds(BOUNDS,{padding:[70,70]});
document.getElementById("reset").onclick=()=>{
  onKind.fill(true); onDist.fill(true); hexKm=10;
  CATS.forEach(c=>onCat[c.c]=true); showPts=true; drawPts(); toggleRoutes(false);
  document.querySelectorAll("#kinds input,#dists input").forEach(c=>c.checked=true);
  document.querySelectorAll("#hexsize button").forEach((b,i)=>b.classList.toggle("on",i===1));
  unpick(); build(); map.fitBounds(BOUNDS,{padding:[70,70]});};
addEventListener("keydown",e=>{if(e.key==="Escape"){unpick();
  document.getElementById("tablewrap").classList.remove("on");}});
["ctl","info","tablewrap"].forEach(id=>{const e=document.getElementById(id);
  L.DomEvent.disableClickPropagation(e); L.DomEvent.disableScrollPropagation(e);});

document.getElementById("dn").innerHTML=
  "The source layers overlap. Summed, the 63 polygons come to <b>"+RAWSUM.toLocaleString("en-IN")+
  " ha</b>; dissolved so each patch of ground counts once, they cover <b>"+UNION.toLocaleString("en-IN")+
  " ha</b> — <b>"+Math.round(100*(RAWSUM-UNION)/RAWSUM)+"% double-counted</b>. "+
  "<code>Farmlands</code> and <code>farmland</code> are largely the same ground. "+
  "The hexes below use the dissolved figure. Even so this is 2.9× the 2.12 lakh ha the Andhra "+
  "report gives for the whole state, so these remain zone outlines, not farm boundaries. "+
  "<br><br>Of the "+PTS.length+" facility points, <b>"+
  PTS.filter(p=>/NOT exact|area reference|village reference|area centroid/i.test(p.p||"")).length+
  "</b> are village or area references rather than surveyed pins, and <b>"+
  PTS.filter(p=>p.f).length+"</b> are flagged — dashed outline on the map.";

drawPts();
build();
</script>
